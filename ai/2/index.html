<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Globe City Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header Section -->
        <header class="header">
            <h1>🌍 3D Globe City Tracker</h1>
            <p>Explore the world by pinning your favorite cities</p>
        </header>

        <!-- Main Content -->
        <div class="content">
            <!-- Left Panel: Input and Table -->
            <div class="panel left-panel">
                <div class="input-section">
                    <h2>Add a City</h2>
                    <div class="input-group">
                        <input 
                            type="text" 
                            id="cityInput" 
                            placeholder="Enter city name (e.g., Paris, Tokyo)" 
                            autocomplete="off"
                        />
                        <button id="addButton" class="btn-primary">
                            <span>Add Pin</span>
                        </button>
                    </div>
                    <div id="statusMessage" class="status-message"></div>
                </div>

                <div class="table-section">
                    <h2>Pinned Locations</h2>
                    <div class="table-container">
                        <table id="locationsTable">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>City</th>
                                    <th>Coordinates</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody">
                                <!-- Dynamically populated -->
                            </tbody>
                        </table>
                        <div id="emptyState" class="empty-state">
                            <p>No cities pinned yet. Start exploring!</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Panel: 3D Globe -->
            <div class="panel globe-panel">
                <div id="globeViz"></div>
                <div class="globe-controls">
                    <button id="resetView" class="btn-secondary">Reset View</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="//unpkg.com/three"></script>
    <script src="//unpkg.com/globe.gl"></script>
    <script src="app.js"></script>
</body>
</html>
